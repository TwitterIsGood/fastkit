name: Baseline Profile

# 只在需要重新采集时手动触发：跑一次要拉起模拟器，十几分钟。
on:
  workflow_dispatch:

jobs:
  generate:
    # ubuntu runner 有 KVM；macOS runner 没有嵌套虚拟化，模拟器跑不动
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 采集 baseline profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # API 34 的 AOSP 镜像在 sdkmanager 里叫 default
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: ./gradlew :app:generateBaselineProfile --console=plain

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: |
            app/src/**/baselineProfiles/*.txt
            **/build/reports/androidTests/**/*
          if-no-files-found: warn
