name: Android CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试
        run: >
          ./gradlew
          :fastkit-image:testDebugUnitTest
          :fastkit-list:testDebugUnitTest
          --console=plain

      - name: 构建 debug + release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Lint
        run: ./gradlew :fastkit-image:lintDebug :fastkit-list:lintDebug --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
